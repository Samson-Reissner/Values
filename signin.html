<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Value Loans</title>
    <link rel="stylesheet" href="../styles/custom.css">
    <link rel="stylesheet" href="/styles/new.css">
</head>

<body>

<!-- Home Button -->
<div class="home-btn-container">
    <a href="../index.html" class="home-btn">
        <i class="fas fa-home"></i> Home
    </a>
</div>


<!-- Modal Background -->
<div class="auth-bg">

    <!-- Modal Login Card -->
    <div class="auth-card">
            <div class="card-logo">
                <img src="images/Value-logo.png"Value Loans Logo" class="logo-image">
            </div>

        <h2 class="section-title" style="text-align:center;">Welcome Back</h2>
        <p class="section-subtitle" style="text-align:center;">Login to continue</p>


        <form class="auth-form">

            <div class="form-group">
                <label for="email">Username or Email</label>
                <input type="text" id="email" name="email" placeholder="Enter username or email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>

            <div class="auth-links" style="text-align:center; margin-top:20px;">
                <p>Don't have an account?
                    <a href="signup-wizard.html" class="link-primary">Sign Up</a>
                </p>
            </div>

        </form>
    </div>

</div>

<script>
const BACKEND_URL = "http://localhost:3000"; // your Rails API

document.addEventListener("DOMContentLoaded", () => {
    const form = document.querySelector(".auth-form");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const payload = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        if (!payload.email || !payload.password) {
            alert("Please fill in both fields.");
            return;
        }

        // --- SEND REQUEST TO BACKEND ---
        const response = await fetch(`${BACKEND_URL}/api/v1/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            alert(data.error || "Invalid email or password");
            return;
        }

        // --- SAVE TOKEN ---
        localStorage.setItem("token", data.token);

        // --- REDIRECT TO DASHBOARD ---
        window.location.href = "dashboard.html";
    });
});
</script>


</body>
</html>
