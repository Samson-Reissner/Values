<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrow Options - Value</title>
    <link rel="stylesheet" href="../styles/custom.css">

    <style>
        body {
            background: #f7f7f7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .header p {
            color: #666;
        }
        .investment-card {
            background: #fff;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            border: 1px solid #eee;
        }
        .investment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }
        .investment-header h3 {
            margin: 0;
            color: #333;
            font-size: 20px;
        }
        .investment-id {
            background: #e7f3ff;
            color: #1e73ff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }
        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }
        @media (max-width: 600px) {
            .details-grid {
                grid-template-columns: 1fr;
            }
        }
        .detail-item {
            padding: 15px;
            background: #f9f9f9;
            border-radius: 10px;
        }
        .detail-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        .currency {
            color: #28a745;
        }
        .contact-info {
            background: #fff8e1;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
            margin-bottom: 25px;
        }
        .contact-label {
            font-size: 14px;
            color: #856404;
            margin-bottom: 5px;
        }
        .contact-value {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }
        .borrow-options {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }
        .borrow-options h4 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus {
            outline: none;
            border-color: #1e73ff;
            box-shadow: 0 0 0 2px rgba(30, 115, 255, 0.1);
        }
        .btn-group {
            display: flex;
            gap: 15px;
        }
        button {
            flex: 1;
            padding: 15px;
            border: none;
            color: white;
            font-size: 15px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-full {
            background: #1e73ff;
        }
        .btn-full:hover {
            background: #005be0;
            transform: translateY(-2px);
        }
        .btn-custom {
            background: #28a745;
        }
        .btn-custom:hover {
            background: #218838;
            transform: translateY(-2px);
        }
        .btn-back {
            background: #6c757d;
            margin-top: 20px;
            width: 100%;
            padding: 12px;
        }
        .btn-back:hover {
            background: #5a6268;
        }
        .loading, .error, .no-data {
            text-align: center;
            padding: 40px 20px;
            color: #666;
            font-size: 16px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .error {
            color: #dc3545;
        }
        .success {
            color: #28a745;
            text-align: center;
            padding: 20px;
        }
        .info-note {
            background: #e7f3ff;
            padding: 12px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            color: #1e73ff;
            border-left: 4px solid #1e73ff;
        }
        .multiple-investments {
            margin-top: 30px;
        }
        .other-investments {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .other-investments h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .other-investment-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .other-investment-details h4 {
            margin: 0 0 5px 0;
            color: #333;
        }
        .other-investment-details p {
            margin: 0;
            font-size: 14px;
            color: #666;
        }
        .view-other-btn {
            background: #6c757d;
            padding: 8px 15px;
            border-radius: 6px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            transition: background 0.3s;
        }
        .view-other-btn:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Borrow from Investment</h1>
        <p>Review and borrow from the selected lender</p>
    </div>

    <!-- Main investment details will be loaded here -->
    <div id="investment-details" class="loading">
        Loading investment details...
    </div>

    <!-- Other available investments section -->
    <div id="other-investments" class="other-investments" style="display: none;">
        <h3>Other Available Investments</h3>
        <div id="other-investments-list"></div>
    </div>

    <button onclick="window.location.href='dashboard.html'" class="btn-back">
        ← Back to Dashboard
    </button>
</div>

<script>
const token = localStorage.getItem("token") || localStorage.getItem("authToken");

if (!token) {
    window.location.href = "login.html";
}

// Extract investment ID from URL
function getInvestmentIdFromURL() {
    const urlParams = new URLSearchParams(window.location.search);
    const investmentId = urlParams.get('investment_id') || urlParams.get('id');
    console.log("Extracted investment ID from URL:", investmentId);
    return investmentId;
}

// Fetch specific investment based on URL parameter
async function fetchSpecificInvestment(investmentId) {
    try {
        console.log("Fetching specific investment with ID:", investmentId);
        
        // Try to fetch the specific investment
        const response = await fetch(`http://localhost:3000/api/v1/p2p_investments/${investmentId}`, {
            headers: { 
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }
        });
        
        console.log("Specific investment response status:", response.status);
        
        if (response.status === 404 || response.status === 400) {
            console.log("Specific investment not found, will fetch all");
            return null;
        }
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const investment = await response.json();
        console.log("Specific investment data:", investment);
        return investment;
        
    } catch (error) {
        console.error("Error fetching specific investment:", error);
        return null;
    }
}

// Fetch all investments
async function fetchAllInvestments() {
    try {
        console.log("Fetching all investments...");
        const response = await fetch(`http://localhost:3000/api/v1/borrower/dashboard`, {
            headers: { 
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            }
        });
        
        console.log("All investments response status:", response.status);
        
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const investments = await response.json();
        console.log("All investments data:", investments);
        return investments;
        
    } catch (error) {
        console.error("Error fetching all investments:", error);
        return [];
    }
}

// Load investment data
async function loadInvestment() {
    const container = document.getElementById("investment-details");
    const otherInvestmentsContainer = document.getElementById("other-investments");
    const otherInvestmentsList = document.getElementById("other-investments-list");
    
    const investmentId = getInvestmentIdFromURL();
    
    try {
        let mainInvestment = null;
        let allInvestments = [];
        
        // If we have an investment ID, try to fetch it specifically
        if (investmentId) {
            mainInvestment = await fetchSpecificInvestment(investmentId);
        }
        
        // Always fetch all investments to show other options
        allInvestments = await fetchAllInvestments();
        
        if (!allInvestments || allInvestments.length === 0) {
            container.innerHTML = 
                '<div class="no-data">No investment offers available at the moment.</div>';
            return;
        }
        
        // If we didn't get a specific investment but have all investments, use the first one
        if (!mainInvestment && allInvestments.length > 0) {
            if (investmentId) {
                // Try to find the investment by ID in the list
                mainInvestment = allInvestments.find(inv => inv.id == investmentId);
            }
            
            // If still not found, use the first one
            if (!mainInvestment) {
                mainInvestment = allInvestments[0];
            }
        }
        
        // Display the main investment
        if (mainInvestment) {
            displayInvestment(mainInvestment);
        } else {
            container.innerHTML = 
                '<div class="no-data">Investment not found. Please select another.</div>';
        }
        
        // Display other investments (excluding the main one)
        if (allInvestments.length > 1) {
            const otherInvestments = allInvestments.filter(inv => 
                mainInvestment ? inv.id != mainInvestment.id : true
            );
            
            if (otherInvestments.length > 0) {
                displayOtherInvestments(otherInvestments);
                otherInvestmentsContainer.style.display = 'block';
            }
        }
        
    } catch (error) {
        console.error("Error loading investment:", error);
        container.innerHTML = 
            `<div class="error">Error loading investment details: ${error.message}</div>`;
    }
}

function displayInvestment(investment) {
    const container = document.getElementById("investment-details");
    
    const formattedAmount = new Intl.NumberFormat('en-MW', {
        style: 'currency',
        currency: 'MWK'
    }).format(investment.amount);
    
    container.innerHTML = `
        <div class="investment-card">
            <div class="investment-header">
                <h3>Investment Offer #${investment.id}</h3>
                <span class="investment-id">ID: ${investment.id}</span>
            </div>
            
            <div class="details-grid">
                <div class="detail-item">
                    <div class="detail-label">Lender</div>
                    <div class="detail-value">${investment.lender_name || 'Not specified'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Available Amount</div>
                    <div class="detail-value currency">${formattedAmount}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Interest Rate</div>
                    <div class="detail-value">${investment.interest_rate}% ${investment.interest_period || 'per annum'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Tenure</div>
                    <div class="detail-value">${investment.tenure_months} months</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Status</div>
                    <div class="detail-value">${investment.status || 'Available'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Minimum Amount</div>
                    <div class="detail-value">MWK ${investment.min_amount || '1000'}</div>
                </div>
            </div>
            
            ${investment.masked_contact ? `
            <div class="contact-info">
                <div class="contact-label">Lender Contact</div>
                <div class="contact-value">${investment.masked_contact}</div>
            </div>
            ` : ''}
            
            <div class="borrow-options">
                <h4>Borrow from this offer</h4>
                <div class="input-group">
                    <input type="number" 
                           id="custom-amount" 
                           placeholder="Enter amount (MWK)" 
                           min="${investment.min_amount || 1000}" 
                           max="${investment.amount}"
                           step="1000"
                           value="${investment.amount}">
                </div>
                <div class="btn-group">
                    <button class="btn-full" onclick="borrowFullAmount(${investment.id}, ${investment.amount})">
                        Borrow Full Amount
                    </button>
                    <button class="btn-custom" onclick="borrowCustomAmount(${investment.id})">
                        Borrow Custom Amount
                    </button>
                </div>
            </div>
            
            <div class="info-note">
                <i>Note: The lender will review your request before funds are released.</i>
            </div>
        </div>
    `;
    
    container.className = '';
}

function displayOtherInvestments(investments) {
    const container = document.getElementById("other-investments-list");
    container.innerHTML = '';
    
    investments.forEach(investment => {
        const formattedAmount = new Intl.NumberFormat('en-MW', {
            style: 'currency',
            currency: 'MWK'
        }).format(investment.amount);
        
        const item = document.createElement('div');
        item.className = 'other-investment-item';
        item.innerHTML = `
            <div class="other-investment-details">
                <h4>Investment #${investment.id} - ${investment.lender_name || 'Anonymous Lender'}</h4>
                <p>Amount: ${formattedAmount} | Interest: ${investment.interest_rate}% | Tenure: ${investment.tenure_months} months</p>
            </div>
            <a href="borrow_options.html?investment_id=${investment.id}" class="view-other-btn">
                View & Borrow
            </a>
        `;
        
        container.appendChild(item);
    });
}

// Borrow functions
async function sendBorrowRequest(investmentId, amountParam) {
    try {
        let payload;
        
        if (amountParam === "full") {
            payload = { amount: "full" };
        } else {
            payload = { amount: amountParam };
        }
        
        console.log("Sending borrow request for investment", investmentId, "with payload:", payload);
        
        const response = await fetch(`http://localhost:3000/api/v1/p2p_investments/${investmentId}/borrow`, {
            method: "POST",
            headers: {
                "Authorization": "Bearer " + token,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });
        
        const data = await response.json();
        console.log("Response:", data);
        
        if (!response.ok) {
            throw new Error(data.error || data.message || "Borrow request failed");
        }
        
        alert("Borrow request submitted successfully!");
        window.location.href = "dashboard.html";
        
    } catch (error) {
        console.error("Borrow request error:", error);
        alert(`Error: ${error.message}\n\nPlease check if the lender is still available and try again.`);
    }
}

function borrowFullAmount(investmentId, amount) {
    if (confirm(`Are you sure you want to borrow the full amount of MWK ${amount.toLocaleString()}?`)) {
        sendBorrowRequest(investmentId, "full");
    }
}

function borrowCustomAmount(investmentId) {
    const input = document.getElementById('custom-amount');
    const amount = parseFloat(input.value);
    
    if (!amount || amount <= 0) {
        alert("Please enter a valid amount.");
        input.focus();
        return;
    }
    
    const maxAmount = parseFloat(input.max);
    if (amount > maxAmount) {
        alert(`Amount cannot exceed available MWK ${maxAmount.toLocaleString()}`);
        return;
    }
    
    const minAmount = parseFloat(input.min) || 1000;
    if (amount < minAmount) {
        alert(`Minimum borrow amount is MWK ${minAmount.toLocaleString()}`);
        return;
    }
    
    if (confirm(`Are you sure you want to borrow MWK ${amount.toLocaleString()}?`)) {
        sendBorrowRequest(investmentId, amount);
    }
}

// Load investment on page load
document.addEventListener('DOMContentLoaded', function() {
    loadInvestment();
});

// Allow pressing Enter in custom amount field
document.addEventListener('keypress', function(event) {
    if (event.target.id === 'custom-amount' && event.key === 'Enter') {
        const investmentId = getInvestmentIdFromURL();
        if (investmentId) {
            borrowCustomAmount(investmentId);
        }
    }
});
</script>

</body>
</html>
