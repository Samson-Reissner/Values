<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Value Loans</title>
  <link rel="stylesheet" href="styles/custom.css" />
</head>

<body class="login-page">
  <div class="login-container">
    <div class="login-header">
      <div class="logo">
        <a href="index.html" class="logo">
          <img
            src="images/Value-logo.png"
            alt="Value Financial Services"
            class="logo-image"
          />
        </a>
      </div>
      <h1>Welcome Back</h1>
      <p>Sign in to your account to continue</p>
    </div>

    <form class="auth-form" id="loginForm">
      <div class="form-group">
        <label for="login">Email or Username</label>
        <input
          type="text"
          id="login"
          placeholder="Enter email or username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        />
        <div class="forgot-password">
          <a href="forgot-password.html">Forgot password?</a>
        </div>
      </div>

      <button type="submit" class="btn-login-submit">
        Sign In
      </button>
    </form>

    <div class="divider">Don't have an account?</div>

    <div class="signup-link">
      <p>
        New to Value Loans?
        <a href="signup.html">Create an account</a>
      </p>
    </div>

    <div class="back-to-home">
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

  <!-- 📦 GLOBAL CONFIG - Must load first -->
  <script src="js/config.global.js"></script>
  
  <!-- 🔐 AUTH - Depends on config -->
  <script src="js/auth.js"></script>

  <script>
    // API_BASE is now available from config.global.js via window.API_BASE
    document
      .getElementById("loginForm")
      .addEventListener("submit", async (e) => {
        e.preventDefault();

        const login = document.getElementById("login").value.trim();
        const password = document.getElementById("password").value;

        try {
          const res = await fetch(`${window.API_BASE}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ login, password })
          });

          const data = await res.json();

          if (!res.ok) {
            alert(data.error || "Invalid login credentials");
            return;
          }

          // ✅ CENTRALIZED AUTH STORAGE
          Auth.saveAuth(data);

          // ✅ Redirect after login
          window.location.href = "index.html";

        } catch (err) {
          console.error(err);
          alert("Unable to connect to server");
        }
      });
  </script>
</body>
</html>
