<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Value Loans</title>
    <link rel="stylesheet" href="styles/custom.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <a href="index.html" class="logo">
                    <!-- REPLACE: Logo image -->
                    <img src="images/Value-logo.png" alt="Value Financial Services" class="logo-image">
                </a>
            </div>
            <h1>Welcome Back</h1>
            <p>Sign in to your account to continue</p>
        </div>
        
        <form class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                
                <div class="forgot-password">
                    <a href="forgot-password.html">Forgot password?</a>
                </div>
            </div>
            
            <button type="submit" class="btn-login-submit">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>
        
        <div class="divider">Don't have an account?</div>
        
        <div class="signup-link">
            <p>New to Value Loans? <a href="signup-wizard.html">Create an account</a></p>
        </div>
        
        <div class="back-to-home">
            <a href="auth-landing.html">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
const API_BASE = "http://localhost:3000/api/v1";

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    alert("Please enter both email and password.");
    return;
  }

  try {
    const res = await fetch(`${API_BASE}/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json();

    if (!res.ok) {
      alert(data.error || "Login failed");
      return;
    }

    // 🔑 THIS is the backend connection
    localStorage.setItem("authToken", data.token);

    window.location.href = data.user.is_admin
      ? "/admin/dashboard.html"
      : "/dashboard.html";

  } catch (err) {
    console.error(err);
    alert("Server error");
  }
});
</script>

</body>
</html>
