<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Enquiry</title>

<link rel="stylesheet" href="../styles/custom.css">

<!-- AUTH GUARD handled in JS -->
<script src="../scripts/credit_enquiry.js" defer></script>

<style>
body { background:#f7f7f7; }

.form-wrapper {
  max-width: 900px;
  margin: 40px auto;
}

.card {
  background:#fff;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.card h3 {
  margin-bottom:15px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

input, select {
  padding:11px;
  border-radius:8px;
  border:1px solid #ccc;
  width:100%;
}

button {
  padding:14px;
  border:none;
  border-radius:50px;
  background:#1e73ff;
  color:#fff;
  cursor:pointer;
  width:100%;
  font-size:15px;
}

button:hover { background:#005be0; }

.required { color:red; }
</style>
</head>

<body>

<div class="form-wrapper">

  <!-- CARD 1: CONSENT -->
  <div class="card">
    <h3>Consent Details</h3>
    <div class="grid">
      <div>
        <label>Date of Consent</label>
        <input type="date" id="consent_date" readonly>
      </div>
      <div>
        <label>Enquiry Reason</label>
        <input type="text" id="enquiry_reason" required>
      </div>
    </div>
  </div>

  <!-- CARD 2: ENQUIRY -->
  <div class="card">
    <h3>Client Enquiry</h3>

    <div class="grid">
      <select id="title" required>
        <option value="">Title *</option>
        <option>Mr</option>
        <option>Mrs</option>
        <option>Miss</option>
      </select>

      <input placeholder="First Name *" id="first_name" required>
      <input placeholder="Middle Name" id="middle_name">
      <input placeholder="Last Name *" id="last_name" required>

      <select id="sex" required>
        <option value="">Sex *</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <input type="date" id="dob" required>

      <select id="marital_status" required>
        <option value="">Marital Status *</option>
        <option>Single</option>
        <option>Married</option>
      </select>

      <input placeholder="Profession" id="profession">
      <input placeholder="Nationality" id="nationality">
      <input placeholder="Phone" id="phone">
      <input placeholder="Postal Address *" id="postal_address" required>
      <input placeholder="District" id="district">
    </div>

    <hr style="margin:20px 0">

    <h4>Identification (one only)</h4>
    <div class="grid">
      <input placeholder="National ID *" class="id-field" id="nid">
      <input placeholder="Passport *" class="id-field" id="passport">
      <input placeholder="Driver's Licence *" class="id-field" id="drivers">
      <input placeholder="Traffic Registration No *" class="id-field" id="traffic">
      <input placeholder="MEC Registration *" class="id-field" id="mec">
    </div>
  </div>

  <button id="submit_enquiry">Submit Enquiry</button>

</div>
 <script src="../js/credit_enquiry.js"></script>
</body>
</html>
