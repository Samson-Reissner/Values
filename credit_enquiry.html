<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit Enquiry</title>

<link rel="stylesheet" href="../styles/custom.css">

<script src="../js/credit_enquiry.js" defer></script>

<style>
body { background:#f7f7f7; }

.form-wrapper {
  max-width: 900px;
  margin: 40px auto;
}

.card {
  background:#fff;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.card h3 {
  margin-bottom:15px;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
  gap:14px;
}

input, select {
  padding:11px;
  border-radius:8px;
  border:1px solid #ccc;
  width:100%;
}

button {
  padding:14px;
  border:none;
  border-radius:50px;
  background:#1e73ff;
  color:#fff;
  cursor:pointer;
  width:100%;
  font-size:15px;
}

button:hover { background:#005be0; }
</style>
</head>

<body>

<div class="form-wrapper">

  <!-- CARD 1: CONSENT -->
  <div class="card">
    <h3>Consent Details</h3>

    <div class="grid">
      <div>
        <label>Date of Consent</label>
        <input type="date" id="consent_date" readonly>
      </div>

      <div>
        <label>Enquiry Reason</label>
        <select id="enquiry_reason" required>
          <option value="">Select Enquiry Reason *</option>
          <option value="view_credited_clients">View Credited Clients</option>
          <option value="credibility_check">Request a Credibility Check</option>
        </select>
      </div>
    </div>
  </div>

  <!-- CARD 2: CREDIBILITY CHECK -->
  <div class="card" id="credibility_section" style="display:none;">
    <h3>Client Enquiry</h3>

    <div class="grid">
      <select id="title">
        <option value="">Title *</option>
        <option>Mr</option>
        <option>Mrs</option>
        <option>Miss</option>
      </select>

      <input placeholder="First Name *" id="first_name">
      <input placeholder="Middle Name" id="middle_name">
      <input placeholder="Last Name *" id="last_name">

      <select id="sex">
        <option value="">Sex *</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <input type="date" id="dob">

      <select id="marital_status">
        <option value="">Marital Status *</option>
        <option>Single</option>
        <option>Married</option>
      </select>

      <input placeholder="Profession" id="profession">
      <input placeholder="Nationality" id="nationality">
      <input placeholder="Phone" id="phone">
      <input placeholder="Postal Address *" id="postal_address">
      <input placeholder="District" id="district">
    </div>

    <hr style="margin:20px 0">

    <h4>Identification (one only)</h4>
    <div class="grid">
      <input placeholder="National ID" class="id-field" id="nid">
      <input placeholder="Passport" class="id-field" id="passport">
      <input placeholder="Driver's Licence" class="id-field" id="drivers">
      <input placeholder="Traffic Registration No" class="id-field" id="traffic">
      <input placeholder="MEC Registration" class="id-field" id="mec">
    </div>
  </div>

  <!-- CARD 3: VIEW CREDITED CLIENTS -->
  <div class="card" id="credited_clients_section" style="display:none;">
    <h3>Credited Clients</h3>

    <div class="grid">
      <input placeholder="Search by National ID" id="search_nid">
      <input placeholder="Search by Phone Number" id="search_phone">
      <input placeholder="Search by Client Name" id="search_name">
    </div>

    <div id="credited_clients_results" style="margin-top:20px;"></div>
  </div>

  <!-- ACTION BUTTON -->
  <button id="submit_enquiry">Continue</button>

</div>

</body>
</html>
