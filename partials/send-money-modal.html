<script>
// Quick amount buttons functionality
document.addEventListener('DOMContentLoaded', function() {
  setTimeout(function() {
    // Quick amount buttons
    const quickAmountBtns = document.querySelectorAll('.quick-amount-btn');
    quickAmountBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        const amount = this.getAttribute('data-amount');
        const amountInput = document.getElementById('sendAmount');
        if (amountInput) {
          amountInput.value = amount;
          amountInput.dispatchEvent(new Event('input'));
        }
      });
    });
    
    // Update displayed amount
    const amountInput = document.getElementById('sendAmount');
    const displayAmount = document.getElementById('displayAmount');
    
    if (amountInput && displayAmount) {
      amountInput.addEventListener('input', function() {
        const value = parseFloat(this.value || 0);
        displayAmount.textContent = 'MWK ' + value.toFixed(2);
      });
    }
    
    // Update modal wallet balance from main wallet balance
    function updateModalBalance() {
      const mainBalance = document.getElementById('walletBalance')?.textContent;
      const modalBalance = document.getElementById('modalWalletBalance');
      if (mainBalance && modalBalance) {
        modalBalance.textContent = mainBalance;
      }
    }
    
    // Auto-focus on amount input when modal opens
    const sendMoneyBtn = document.getElementById('sendMoneyBtn');
    if (sendMoneyBtn) {
      sendMoneyBtn.addEventListener('click', function() {
        setTimeout(() => {
          updateModalBalance();
          const amountInput = document.getElementById('sendAmount');
          if (amountInput) {
            amountInput.focus();
          }
        }, 300);
      });
    }
  }, 100);
});
</script>
